# Front of the Render service: WebSocket connections go to the Godot server, browsers are sent
# to the game page. __PORT__ is replaced at start by Render's PORT.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
	worker_connections 512;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path /tmp/nginx-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	server {
		listen __PORT__;

		# An invitation: /K7P2QX opens the game on that room.
		location ~ "^/([A-Za-z0-9]{6})/?$" {
			return 302 __PAGE__#$1;
		}

		location = /healthz {
			return 200 "ok\n";
		}

		location / {
			if ($http_upgrade !~* "^websocket$") {
				return 302 __PAGE__;
			}
			proxy_pass http://127.0.0.1:9090;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_buffering off;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
		}
	}
}
