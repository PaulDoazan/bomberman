# Production on Render, deployed from GitHub once the CI checks pass (.github/workflows/ci.yml).
services:
  # The game page on cafenavette.com: the web export, built by Render.
  - type: web
    name: cafenavette-site
    runtime: static
    branch: pauldoazan/server-websocket
    autoDeployTrigger: checksPass
    buildCommand: bash deploy/build-web.sh
    staticPublishPath: ./build/web
    domains:
      - cafenavette.com
    routes:
      # An invitation link, cafenavette.com/K7P2QX, opens the game, which reads the code
      # (files that exist are served as they are; the page's <base href="/"> keeps their
      # addresses at the root).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Revalidated on each visit, so the page and the server stay on the same version.
      - path: /*
        name: Cache-Control
        value: no-cache

  # The authoritative game server (WebSocket), behind nginx.
  - type: web
    name: cafenavette
    runtime: docker
    plan: free
    region: frankfurt
    branch: pauldoazan/server-websocket
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
